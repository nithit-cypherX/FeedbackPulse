# Deployment is disabled until repository variable FEEDBACKPULSE_CD_ENABLED is true.
# Automatic deployment requires green CI on main; manual deployment also needs the switch.
# Credentials come from Azure OIDC federation, not from stored long-lived keys.
# Security policy:
# - No long-lived credentials stored in repository: uses Azure OIDC (id-token: write)
# - Container images tagged strictly with Git commit SHA (immutable auditability)
# - Secrets injected only at deployment runtime via Azure Container Apps secrets

name: CD

on: # -- Trigger condition / Event trigger
  workflow_run:
    workflows: [CI] # CD will trigger when CI is completed and push to branch [codex/bootstrap, main]
    types: [completed]
    branches:  
      - "codex/bootstrap"
      - main
  workflow_dispatch: #make github actions have options to trigger it manually

permissions:
  contents: read
  id-token: write # Required for Azure OIDC Federated Credentials

# Prevent concurrent deployment collisions (Prevent race condition from multiple deploys at the same time)
concurrency:
  group: production-deploy
  cancel-in-progress: false

env: # Explicit repository variables; no fallback to another deployment.
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP_ENV: ${{ vars.AZURE_CONTAINER_APP_ENV }}
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
  AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
  AZURE_REGISTRY_IDENTITY_ID: ${{ vars.AZURE_REGISTRY_IDENTITY_ID }}

jobs:
  deploy:
    # Keep this repository-level switch unset while OIDC/deployment setup is incomplete.
    # An environment-level variable is not available when GitHub evaluates this job gate.
    if: >-
      ${{ vars.FEEDBACKPULSE_CD_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion == 'success') ||
           github.event_name == 'workflow_dispatch') }}
    name: Build, Push & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    environment: production # For GitHub to save Deployment Tracking, show URL of Container App and show status in the main page of Repository
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check required deployment settings
        id: settings
        shell: bash
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          for setting in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP_ENV AZURE_CONTAINER_APP_NAME \
            AZURE_REGISTRY_NAME AZURE_REGISTRY_SERVER AZURE_REGISTRY_IDENTITY_ID SERVICE_TOKEN; do
            value="${!setting:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::$setting is not configured"
              exit 1
            fi
          done
          if [[ "$SERVICE_TOKEN" == 'test-service-token-secret-12345' ]]; then
            echo "::error::SERVICE_TOKEN must not use the old example value"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Cache model artifact # caching model artifact for fast deployment
        id: cache-artifact
        uses: actions/cache@v4
        with:
          path: artifacts/
          key: model-artifact-${{ hashFiles('src/feedbackpulse/model_files.py', 'src/feedbackpulse/package_artifact.py') }}

      - name: Assemble model artifact # assembling model artifact before docker build (since artifacts/ is ignored in .gitignore)
        run: |
          if [ ! -d "artifacts/sentiment-6e7ff9fbc17c/model" ]; then
            echo "Artifacts not found. Assembling model artifact..."
            PYTHONPATH=src uv run python -m feedbackpulse.package_artifact
          else
            echo "Artifacts already present from cache."
          fi

      # --- Azure Login via OIDC (No long-lived keys) -------------------------
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name "$AZURE_REGISTRY_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Images are tagged with the commit SHA, never `latest`. A `latest` tag makes it
      # impossible to say which code is serving, which is the question you will be asked
      # during an incident.
      - name: Build and push container image
        run: |
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE_TAG="$AZURE_REGISTRY_SERVER/feedbackpulse:${DEPLOY_SHA}"
          echo "Building and pushing container image: $IMAGE_TAG"
          docker buildx build \
            --platform linux/amd64 \
            -t "$IMAGE_TAG" \
            --push .

      - name: Render Container App configuration
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          MANAGED_ENV_ID=$(az containerapp env show -n "$AZURE_CONTAINER_APP_ENV" -g "$AZURE_RESOURCE_GROUP" --query id -o tsv)
          IMAGE_TAG="$AZURE_REGISTRY_SERVER/feedbackpulse:${DEPLOY_SHA}"

          MANAGED_ENV_ID="$MANAGED_ENV_ID" \
          REGISTRY_SERVER="$AZURE_REGISTRY_SERVER" \
          REGISTRY_IDENTITY_ID="$AZURE_REGISTRY_IDENTITY_ID" \
          IMAGE_TAG="$IMAGE_TAG" \
          uv run python cloudlayer/render_config.py --output rendered_containerapp.yaml

      - name: Deploy revision to Azure Container Apps
        run: |
          set -euo pipefail
          # CD manages only the existing app; a missing app/read error must not trigger creation.
          az containerapp show -n "$AZURE_CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --output none
          az containerapp update -n "$AZURE_CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --yaml rendered_containerapp.yaml --output none

      - name: Verify deployed revision
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          export EXPECTED_IMAGE="$AZURE_REGISTRY_SERVER/feedbackpulse:${DEPLOY_SHA}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          # Azure can accept the update before the new revision is ready. Only poll reads.
          deadline = time.monotonic() + 300
          timeout_error = "Deployment verification timed out after 300 seconds waiting for the latest revision."
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(timeout_error)
              try:
                  result = subprocess.run(
                      ["az", "containerapp", "show", "-n", os.environ["AZURE_CONTAINER_APP_NAME"],
                       "-g", os.environ["AZURE_RESOURCE_GROUP"], "--query",
                       "{state:properties.provisioningState,latest:properties.latestRevisionName,"
                       "ready:properties.latestReadyRevisionName,image:properties.template.containers[0].image,"
                       "traffic:properties.configuration.ingress.traffic}", "-o", "json"],
                      capture_output=True, text=True, check=True, timeout=min(30, remaining),
                  )
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  raise SystemExit("Deployment verification failed: could not read Azure state.") from None
              if time.monotonic() >= deadline:
                  raise SystemExit(timeout_error)
              state = json.loads(result.stdout)
              latest = state.get("latest")
              if state.get("state") in {"Failed", "Canceled", "Cancelled"}:
                  raise SystemExit("Deployment failed: Azure reported " + state["state"] + ".")
              if state.get("image") != os.environ["EXPECTED_IMAGE"]:
                  raise SystemExit("Deployment failed: the image does not match the selected commit.")
              if state.get("state") == "Succeeded" and latest and latest == state.get("ready"):
                  routes = state.get("traffic") or []
                  latest_weight = sum(r.get("weight", 0) for r in routes
                                      if r.get("latestRevision") or r.get("revisionName") == latest)
                  if latest_weight != 100 or sum(r.get("weight", 0) for r in routes) != 100:
                      raise SystemExit("Deployment failed: the latest revision is not receiving all traffic.")
                  print(f"PASS: {latest} is ready, matches the selected commit and receives 100% traffic.")
                  break
              print(f"Waiting for revision: state={state.get('state')}, latest={latest}, "
                    f"ready={state.get('ready')}", flush=True)
              time.sleep(min(10, max(0, deadline - time.monotonic())))
          PY

      # --- Smoke Test: "A deploy that is not smoke-tested is a deploy you have not verified." ---
      - name: Live Smoke Test with Three Known Payloads
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -n "$AZURE_CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          TOKEN="$SERVICE_TOKEN"
          echo "Verifying live endpoint at: https://$FQDN"

          echo "Polling readiness probe..."
          READY=0
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 10 --max-time 30 "https://$FQDN/ready"; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" != 1 ]; then
            echo "::error::The deployed endpoint did not become ready"
            exit 1
          fi
          curl -sf --connect-timeout 10 --max-time 30 "https://$FQDN/health"

          echo "Smoke Test 1 (Positive payload)..."
          curl -sf -X POST "https://$FQDN/predict" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text": "Excellent service! The response was rapid and highly effective."}' \
            | tee /dev/stderr | grep -q sentiment

          echo "Smoke Test 2 (Negative payload)..."
          curl -sf -X POST "https://$FQDN/predict" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text": "The platform completely crashed during checkout and lost my order."}' \
            | tee /dev/stderr | grep -q sentiment

          echo "Smoke Test 3 (Neutral/boundary payload)..."
          curl -sf -X POST "https://$FQDN/predict" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text": "The delivery package arrived on Tuesday afternoon as scheduled."}' \
            | tee /dev/stderr | grep -q sentiment

          echo "==> All 3 smoke tests passed on live deployment."

      - name: Clean up temporary rendered YAML # clean up temporary rendered YAML (rendered_containerapp.yaml) after deployment
        if: always()
        run: rm -f rendered_containerapp.yaml 
