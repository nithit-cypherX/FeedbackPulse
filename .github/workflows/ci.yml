#cheap checks first, so a schema mistake fails in 30 seconds rather than after a build.
name: CI

on: # -- Event Triggers
  push: # Trigger automatically when push to any branch (including codex/bootstrap and feature branch)
    branches: 
      - "codex/bootstrap"
      - main
      - "**"
  pull_request: # Trigger automatically when pull_request to codex/bootstrap or main
    branches:
      - "codex/bootstrap"
      - main
  workflow_dispatch: #make github actions have options to trigger it manually


permissions: # Permission
  contents: read

concurrency: # Cancel in-progress runs on the same branch when new commits are pushed
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -- Jobs
jobs:
  # Job 1: Lint, Portability & Test Suite (Lint, Portability & Test Suite)
  test:
    name: Lint, Portability & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # Get code from repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager # Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # enable cache
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13 # setup python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile # install dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Cache model artifact # caching model artifact for fast deployment
        id: cache-artifact
        uses: actions/cache@v4
        with:
          path: artifacts/
          key: model-artifact-${{ hashFiles('src/feedbackpulse/model_files.py', 'src/feedbackpulse/package_artifact.py') }}

      - name: Assemble model artifact # assembling model artifact (artifacts/sentiment-6e7ff9fbc17c)
        run: |
          if [ ! -d "artifacts/sentiment-6e7ff9fbc17c/model" ]; then
            echo "Artifacts not found. Assembling model artifact..."
            PYTHONPATH=src uv run python -m feedbackpulse.package_artifact
          else
            echo "Artifacts already present from cache."
          fi

      - name: Lint with Ruff # check code style and syntax
        run: uv run ruff check

      - name: Automated Portability Audit (AST check) # check AST protect src/ from importing cloud SDK
        run: uv run pytest tests/test_portability.py -v

      - name: Validate Container App Template # check container app template from hardcode secrets or credential
        run: uv run python cloudlayer/render_config.py --validate-only

      - name: Execute Full Test Suite (Pytest) # run all test 70 test case 
        run: uv run pytest -v

  # Job 2: Container Build & Integration Smoke Test (Container Build & Integration Smoke Test)
  build:
    name: Container Build & Integration Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # Get code from repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager # Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13 # set up python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile # install dependencies from lockfile
        run: uv sync --frozen --all-groups

      - name: Cache model artifact # get cache model artifact from Job 1
        id: cache-artifact
        uses: actions/cache@v4
        with:
          path: artifacts/
          key: model-artifact-${{ hashFiles('src/feedbackpulse/model_files.py', 'src/feedbackpulse/package_artifact.py') }}

      - name: Assemble model artifact # assemble model artifact if not found in cache (since artifacts/ is ignored in .gitignore)
        run: |
          if [ ! -d "artifacts/sentiment-6e7ff9fbc17c/model" ]; then
            echo "Artifacts not found. Assembling model artifact..."
            PYTHONPATH=src uv run python -m feedbackpulse.package_artifact
          else
            echo "Artifacts already present from cache."
          fi

      - name: Set up Docker Buildx # setup docker buildx for build multi-platform image
        uses: docker/setup-buildx-action@v3

      - name: Build container image # Build and tag image with commit SHA (immutable tag)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t feedbackpulse:${{ github.sha }} \
            --load .

      - name: Container integration smoke test # test container integration and check that the service is ready to receive requests.
        run: |
          # 1. Run containerized service in background with test token
          docker run -d --rm --name svc -p 8000:8000 \
            -e SERVICE_TOKEN=ci-test-token \
            feedbackpulse:${{ github.sha }}

          # 2. Poll readiness probe until healthy (up to 60s)
          echo "Waiting for service readiness..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && break || sleep 2
          done

          # 3. Test prediction contract with Bearer token authentication
          echo "Verifying prediction API contract..."
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Authorization: Bearer ci-test-token' \
            -H 'Content-Type: application/json' \
            -d '{"text": "FeedbackPulse CI smoke test positive feedback!"}' \
            | tee /dev/stderr | grep -q sentiment

          # 4. Clean shutdown
          docker stop svc