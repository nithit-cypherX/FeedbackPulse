# Authentication check only. No checkout, image build, resource writes or deployment.
name: Azure OIDC login check

on:
  workflow_dispatch:

permissions: {}

jobs:
  login:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Check required login settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" || { echo "::error::AZURE_CLIENT_ID is not configured"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "::error::AZURE_TENANT_ID is not configured"; exit 1; }

      - name: Log in to Azure with OIDC only
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify the signed-in identity
        id: identity
        shell: python
        run: |
          import json
          import os
          import subprocess

          account = json.loads(subprocess.check_output(
              ["az", "account", "show", "--output", "json"], text=True
          ))
          user = account.get("user", {})
          if (
              account.get("tenantId", "").lower() != os.environ["AZURE_TENANT_ID"].lower()
              or user.get("name", "").lower() != os.environ["AZURE_CLIENT_ID"].lower()
              or user.get("type") != "servicePrincipal"
          ):
              raise SystemExit("Signed-in identity does not match the configured identity")
          print("PASS: OIDC login matches the configured client and tenant.")
          print("Authentication only; deployment permissions were not tested.")
